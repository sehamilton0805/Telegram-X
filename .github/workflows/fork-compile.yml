name: Fork compile check

# Проверка, что Java и Kotlin собираются: без R8, без APK и без релиза. Нативные зависимости (libvpx, ffmpeg,
# tlottie) всё равно собираются: от них зависит preBuild варианта; после первого прогона они берутся из кэша.
# Запускается на рабочих ветках wip/**, чтобы ошибку компиляции было видно раньше, чем в полной сборке
# ветки fork (Fork APK), и чтобы черновая работа не уходила игрокам релизом.

on:
  workflow_dispatch:
  push:
    branches: [ 'wip/**' ]

concurrency:
  group: fork-compile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile latestRelease sources
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs unzip sed wget make clang yasm nasm ccache

      - name: Gradle cache restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-compile-${{ github.run_id }}
          restore-keys: gradle-compile-

      - name: Prepare signing config
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/tgx-fork.p12"
          {
            echo "keystore.file=$RUNNER_TEMP/signing/tgx-fork.p12"
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "key.alias=$KEY_ALIAS"
            echo "key.password=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/keystore.properties"

      - name: Configure project
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_ID: dev.redgreen.tgx
          APP_NAME: Telegram X RG
          APP_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases
          APP_SOURCES_URL: https://github.com/${{ github.repository }}
        run: |
          export TERM=xterm
          export KEYSTORE_FILE="$RUNNER_TEMP/signing/keystore.properties"
          # tlottie собирается Cargo: нужен Rust версии version.rust с целями Android
          bash scripts/setup-rust.sh
          bash scripts/setup.sh
          # No Firebase plugin and no token validation: nothing is shipped from here
          echo "app.experimental=true" >> local.properties

      - name: Compile Java and Kotlin
        run: ./gradlew :app:compileLatestReleaseJavaWithJavac -Pabi=arm64 --stacktrace --no-daemon

      # И после упавшего прогона: собранные нативные библиотеки уже лежат в кэше сборки Gradle
      - name: Gradle cache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-compile-${{ github.run_id }}
