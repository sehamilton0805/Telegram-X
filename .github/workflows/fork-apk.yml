name: Fork APK

on:
  workflow_dispatch:
  push:
    branches: [ fork ]

concurrency:
  # своя очередь у каждой ветки: проверочная сборка рабочей ветки не отменяет сборку fork и наоборот
  group: fork-apk-${{ github.ref }}
  # пуш с [skip apk] не должен убивать идущую сборку APK
  cancel-in-progress: ${{ !contains(github.event.head_commit.message, '[skip apk]') }}

jobs:
  build:
    name: Build nopRelease (arm64)
    # "[skip apk]" в сообщении коммита пропускает сборку APK (например, правки только tdlib-build.yml);
    # "[skip ci]" не подходит: он заглушил бы и сборку TDLib
    if: "!contains(github.event.head_commit.message, '[skip apk]')"
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Patched TDLib (arm64) from pinned release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          PIN=tdlib-patches/pinned.properties
          [[ -f "$PIN" ]] || { echo "::error::$PIN missing - run tdlib-build.yml and commit the pin from its summary"; exit 1; }
          prop () { sed -n "s/^$1=//p" "$PIN" | tr -d '\r'; }
          TD_COMMIT=$(prop td_commit); TAG=$(prop release_tag); ASSET=$(prop asset); SHA=$(prop sha256)
          ACTUAL=$(tr -d '[:space:]' < tdlib/version.txt)
          [[ "$ACTUAL" == "$TD_COMMIT" ]] || { echo "::error::pinned TDLib $TD_COMMIT != submodule $ACTUAL - rerun tdlib-build.yml and update tdlib-patches/pinned.properties"; exit 1; }
          # Готовые библиотеки сабмодуля лежат по NDK и минимальному SDK варианта сборки: вариант nop
          # (один APK для Android 7.0 и новее) собирается основным NDK под android-24. Библиотека из пина
          # должна быть собрана под тот же уровень API: собранная под более новый не загрузится на старых Android
          API=24
          PIN_API=$(prop api)
          [[ "$PIN_API" == "$API" ]] || { echo "::error::pinned TDLib is built for android-${PIN_API:-unknown}, the app variant needs android-$API - rerun tdlib-build.yml and update tdlib-patches/pinned.properties"; exit 1; }
          NDK=$(sed -n 's/^version.ndk_primary=//p' version.properties | tr -d '\r')
          TARGET="tdlib/src/main/libs/$NDK/android-$API/arm64-v8a/libtdjni.so"
          # Промах по пути должен ронять сборку, а не молча оставлять в APK TDLib без патча
          test -f "$TARGET" || { echo "::error::$TARGET not found - the layout of the tdlib submodule has changed"; exit 1; }
          mkdir -p "$RUNNER_TEMP/tdlib"
          gh release download "$TAG" -p "$ASSET" -D "$RUNNER_TEMP/tdlib" --clobber
          echo "$SHA  $RUNNER_TEMP/tdlib/$ASSET" | sha256sum -c -
          cp "$RUNNER_TEMP/tdlib/$ASSET" "$TARGET"
          # До часовой сборки: в подменённом файле должна быть опция патча
          grep -aq disable_online_notification_delay "$TARGET" || { echo "::error::$TAG/$ASSET is not the patched library"; exit 1; }
          echo "patched TDLib $TAG installed into $TARGET: $(grep -c disable_online_notification_delay "$TARGET") option string(s)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs unzip sed wget make clang yasm nasm ccache

      # ffmpeg, libvpx и tlottie теперь собирают задачи Gradle с кэшем сборки (~/.gradle/caches/build-cache-1).
      # Ключ уникален для прогона, чтобы кэш сохранялся после каждой сборки (и упавшей тоже), а брался самый свежий
      - name: Gradle cache restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ github.run_id }}
          restore-keys: |
            gradle-apk-
            gradle-compile-

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # After the cache steps: version.properties feeds the cache key,
      # which must stay stable across builds
      - name: Bump version for reliable updates
        run: |
          BUILD_VERSION=$((1800 + ${{ github.run_number }}))
          sed -i "s/^version.app=.*/version.app=$BUILD_VERSION/" version.properties
          grep '^version.app=' version.properties

      - name: Prepare signing config
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/tgx-fork.p12"
          {
            echo "keystore.file=$RUNNER_TEMP/signing/tgx-fork.p12"
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "key.alias=$KEY_ALIAS"
            echo "key.password=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/keystore.properties"

      - name: Configure project
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_ID: dev.redgreen.tgx
          APP_NAME: Telegram X RG
          APP_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases
          APP_SOURCES_URL: https://github.com/${{ github.repository }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          export TERM=xterm
          export KEYSTORE_FILE="$RUNNER_TEMP/signing/keystore.properties"
          # tlottie собирается Cargo: нужен Rust версии version.rust с целями Android
          bash scripts/setup-rust.sh
          bash scripts/setup.sh
          # A google-services.json for our applicationId enables FCM push and drops the
          # "experimental build" banner + FORCE_DISABLE_NOTIFICATIONS. Without the secret,
          # fall back to an experimental build (no Firebase plugin, no token validation).
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            echo "app.experimental=true" >> local.properties
          fi

      - name: Build APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # ccache 4.x defaults to ~/.cache/ccache (XDG); pin the dir the cache step archives
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1G
        run: |
          ccache --zero-stats
          # Вариантов по ABI больше нет: набор ABI задаёт -Pabi, без него собрались бы все четыре.
          # Вариант по версии Android - nop (minSdk 24): апстрим делит APK на Android 7-9 (nop), 10-12 (qrs)
          # и 13+ (latest), а форк раздаёт один файл для Android 7.0 и новее, как до слияния (тогда latest
          # был minSdk 24). Верхнюю границу nop снимает buildSrc/src/main/kotlin/Config.kt
          ./gradlew :app:assembleNopRelease -Pabi=arm64 --stacktrace --no-daemon
          ccache --show-stats

      - name: Gradle cache save
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-apk-${{ github.run_id }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgx-fork-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      # После выгрузки артефакта: если проверка ошибётся сама, собранный APK останется в прогоне
      - name: Verify APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK_COUNT=$(find app/build/outputs/apk -name '*.apk' | wc -l)
          [[ "$APK_COUNT" == "1" ]] || { echo "::error::expected exactly one APK, found $APK_COUNT"; find app/build/outputs/apk -name '*.apk'; exit 1; }
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          [[ "$APK" != *-unsigned* ]] || { echo "::error::the APK is unsigned: $APK"; exit 1; }
          # APK должен встать поверх прежних сборок и на Android 7.0 и новее: тот же applicationId, код версии
          # выше, чем у любой прежней сборки, minSdk 24 и никакой верхней границы
          AAPT2=$(find "$ANDROID_SDK_ROOT/build-tools" -name aapt2 -type f | sort -V | tail -1)
          [[ -n "$AAPT2" ]] || { echo "::error::aapt2 not found under $ANDROID_SDK_ROOT/build-tools"; exit 1; }
          BADGING=$("$AAPT2" dump badging "$APK")
          grep -E "^(package|sdkVersion|maxSdkVersion|targetSdkVersion|native-code)" <<< "$BADGING"
          grep -q "^package: name='dev.redgreen.tgx' " <<< "$BADGING" || { echo "::error::applicationId of the APK is not dev.redgreen.tgx"; exit 1; }
          VERSION_CODE=$(sed -n "s/^package: .* versionCode='\([0-9]*\)'.*/\1/p" <<< "$BADGING")
          BUILD_VERSION=$((1800 + ${{ github.run_number }}))
          [[ -n "$VERSION_CODE" && "$VERSION_CODE" -ge $((BUILD_VERSION * 1000)) && "$VERSION_CODE" -lt $(((BUILD_VERSION + 1) * 1000)) ]] || { echo "::error::versionCode '$VERSION_CODE' is outside the range of build $BUILD_VERSION"; exit 1; }
          grep -q "^sdkVersion:'24'" <<< "$BADGING" || { echo "::error::minSdk of the APK is not 24"; exit 1; }
          if grep -q "^maxSdkVersion" <<< "$BADGING"; then echo "::error::the APK declares maxSdkVersion"; exit 1; fi
          # Нативные библиотеки: только arm64-v8a; патченная libtdjni.so и всё, без чего она не загрузится
          # (общий STL и OpenSSL сабмодуля)
          LIBS=$(unzip -Z1 "$APK" 'lib/*')
          echo "$LIBS"
          ABIS=$(cut -d/ -f2 <<< "$LIBS" | sort -u | tr '\n' ' ')
          [[ "$ABIS" == "arm64-v8a " ]] || { echo "::error::unexpected ABI set in the APK: $ABIS"; exit 1; }
          for so in libtdjni.so libc++_shared.so libcryptox.so libsslx.so; do
            grep -qxF "lib/arm64-v8a/$so" <<< "$LIBS" || { echo "::error::$so is missing from the APK"; exit 1; }
          done
          # Промах по каталогу варианта оставил бы в APK апстримную библиотеку без патча
          PATCHED=$(unzip -p "$APK" lib/arm64-v8a/libtdjni.so | grep -c disable_online_notification_delay || true)
          [[ "$PATCHED" -ge 1 ]] || { echo "::error::libtdjni.so inside the APK is not the patched one"; exit 1; }
          # Подпись: тем же ключом, что и прежние сборки (он в секретах), иначе Android не поставит APK поверх
          # установленного. Не удалось получить отпечатки - это предупреждение, а не отказ
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          APK_CERT=$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 || true)
          KEY_CERT=$(keytool -list -keystore "$RUNNER_TEMP/signing/tgx-fork.p12" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" 2>/dev/null | sed -n 's/^Certificate fingerprint (SHA-256): //p' | tr -d ':' | tr 'A-F' 'a-f' | head -1 || true)
          if [[ -z "$APK_CERT" || -z "$KEY_CERT" ]]; then
            echo "::warning::could not compare the APK signer with the keystore (apk: '$APK_CERT', keystore: '$KEY_CERT')"
          elif [[ "$APK_CERT" != "$KEY_CERT" ]]; then
            echo "::error::the APK is signed with $APK_CERT, the release key is $KEY_CERT"; exit 1
          else
            echo "signed with the release key, certificate SHA-256 $APK_CERT"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK_COUNT=$(find app/build/outputs/apk -name '*.apk' | wc -l)
          # Один APK на сборку: иначе в релиз ушёл бы случайный из нескольких
          [[ "$APK_COUNT" == "1" ]] || { echo "::error::expected exactly one APK, found $APK_COUNT"; find app/build/outputs/apk -name '*.apk'; exit 1; }
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          TAG="build-${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short "${{ github.sha }}")
          cp "$APK" "Telegram-X-RG-$TAG-$SHORT_SHA.apk"
          if [[ "${{ github.ref_name }}" == "fork" ]]; then
            gh release create "$TAG" "Telegram-X-RG-$TAG-$SHORT_SHA.apk" \
              --title "Telegram X RG $TAG ($SHORT_SHA)" \
              --notes "Automated fork build. Commit: ${{ github.sha }}" \
              --latest
          else
            # Сборка с рабочей ветки: пре-релиз для проверки, «latest» остаётся за веткой fork.
            # Без --target, как и у релизов ветки fork: тег на коммит рабочей ветки GitHub токену воркфлоу
            # может не дать поставить (HTTP 403 в tdlib-build.yml 23.11); ветка и коммит записаны в названии
            gh release create "$TAG" "Telegram-X-RG-$TAG-$SHORT_SHA.apk" \
              --title "Telegram X RG $TAG pre-release (${{ github.ref_name }}, $SHORT_SHA)" \
              --notes "Тестовая сборка ветки ${{ github.ref_name }}, для проверки перед выпуском. Игрокам: ставьте сборку с пометкой Latest. Commit: ${{ github.sha }}" \
              --prerelease --latest=false
          fi
