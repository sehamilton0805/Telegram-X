name: Fork APK

on:
  workflow_dispatch:
  push:
    branches: [ fork ]

concurrency:
  group: fork-apk
  cancel-in-progress: true

jobs:
  build:
    name: Build latestArm64Release
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs unzip sed wget make clang yasm nasm ccache

      - name: Native libraries cache
        id: native-cache
        uses: actions/cache@v4
        with:
          path: |
            app/jni/third_party/ffmpeg/build
            app/jni/third_party/libvpx/build
            app/.cxx
          key: natives-latest-arm64-${{ hashFiles('version.properties') }}

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/**') }}
          restore-keys: gradle-

      - name: ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: ccache-${{ github.sha }}
          restore-keys: ccache-

      # After the cache steps: version.properties feeds the natives cache key,
      # which must stay stable across builds
      - name: Bump version for reliable updates
        run: |
          BUILD_VERSION=$((1800 + ${{ github.run_number }}))
          sed -i "s/^version.app=.*/version.app=$BUILD_VERSION/" version.properties
          grep '^version.app=' version.properties

      - name: Prepare signing config
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/signing/tgx-fork.p12"
          {
            echo "keystore.file=$RUNNER_TEMP/signing/tgx-fork.p12"
            echo "keystore.password=$KEYSTORE_PASSWORD"
            echo "key.alias=$KEY_ALIAS"
            echo "key.password=$KEY_PASSWORD"
          } > "$RUNNER_TEMP/signing/keystore.properties"

      - name: Configure project and build native dependencies
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APP_ID: dev.redgreen.tgx
          APP_NAME: Telegram X RG
          APP_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases
          APP_SOURCES_URL: https://github.com/${{ github.repository }}
          NATIVE_CACHE_HIT: ${{ steps.native-cache.outputs.cache-hit }}
        run: |
          export TERM=xterm
          export KEYSTORE_FILE="$RUNNER_TEMP/signing/keystore.properties"
          # Trim the native build matrix to the single shipped variant (latest + arm64-v8a)
          sed -i 's/^for ABI in arm64-v8a x86_64 armeabi-v7a x86 ; do$/for ABI in arm64-v8a ; do/' scripts/private/build-ffmpeg-impl.sh
          sed -i 's/^for ABI in arm64-v8a armeabi-v7a x86_64 x86 ; do$/for ABI in arm64-v8a ; do/' scripts/private/build-vpx-impl.sh
          sed -i 's/for FLAVOR in \$FLAVORS; do/for FLAVOR in latest; do/' scripts/private/build-ffmpeg-impl.sh scripts/private/build-vpx-impl.sh
          # Skip vpx/ffmpeg entirely when restored from cache
          if [[ "$NATIVE_CACHE_HIT" == "true" ]]; then
            sed -i 's/^build-vpx-impl.sh$/echo "libvpx restored from cache"/' scripts/setup.sh
            sed -i 's/^build-ffmpeg-impl.sh$/echo "ffmpeg restored from cache"/' scripts/setup.sh
          fi
          bash scripts/setup.sh
          echo "app.experimental=true" >> local.properties

      - name: Build APK
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # ccache 4.x defaults to ~/.cache/ccache (XDG); pin the dir the cache step archives
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_MAXSIZE: 1G
        run: |
          ccache --zero-stats
          ./gradlew :app:assembleLatestArm64Release --stacktrace --no-daemon
          ccache --show-stats

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tgx-fork-arm64
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -1)
          TAG="build-${{ github.run_number }}"
          SHORT_SHA=$(git rev-parse --short "${{ github.sha }}")
          cp "$APK" "Telegram-X-RG-$TAG-$SHORT_SHA.apk"
          gh release create "$TAG" "Telegram-X-RG-$TAG-$SHORT_SHA.apk" \
            --title "Telegram X RG $TAG ($SHORT_SHA)" \
            --notes "Automated fork build. Commit: ${{ github.sha }}" \
            --latest
